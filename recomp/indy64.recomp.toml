# Native-call opcode: after each argument fetcher returns its value in t1, the VM jumps to stub v1 of an array of
# 8-byte stubs at 0x41029F74 (jr a0 + v1*8, a0 = 0x41029F74). Each stub is "j 0x41029ED8" with a delay slot that moves
# t1 to a1, a2, a3 or the stack argument slot sp+0x10+4*(v1-3). Do the move in a hook and replace the computed jump
# with a branch back to the loop head (the addiu v1 in the delay slot still runs).
[[patches.hook]]
func = "FUN_41029c94"
before_vram = 0x41029F04
text = "{ int32_t arg_index = (int32_t)ctx->r3; if (arg_index == 0) ctx->r5 = ctx->r9; else if (arg_index == 1) ctx->r6 = ctx->r9; else if (arg_index == 2) ctx->r7 = ctx->r9; else MEM_W(0x10 + 4 * (arg_index - 3), ctx->r29) = (int32_t)ctx->r9; }"
[[patches.instruction]]
func = "FUN_41029c94"
vram = 0x41029F04   # jr t2  ->  b 0x41029ED8
value = 0x1000FFF4

