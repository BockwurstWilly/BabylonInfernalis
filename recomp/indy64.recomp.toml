# N64Recomp configuration for Indiana Jones and the Infernal Machine (USA).
# Hand-written base: tools/make_recomp_config.py appends generated patches and writes indy64.recomp.toml.
# Symbol-file mode (no ELF): indy64.syms.toml is generated by tools/make_recomp_syms.py.

[input]
entrypoint = 0x40000400
symbols_file_path = "indy64.syms.toml"
rom_file_path = "../rom/indy.z64"
output_func_path = "../indy64recomp/RecompiledFuncs"
# osInitialize only sets SR.CU1 (0x20000000), not SR.FR: 32-bit FPU register pairs.
uses_mips3_float_mode = false

[patches]
# The game's own TLB / demand-paging machinery. A native port maps 0x41000000 as plain memory instead,
# so these must not run. (The runtime still needs an address translation for 0x40xxxxxx/0x41xxxxxx, see NOTES.md.)
stubs = [
    "tlb_clear_all",
    "tlb_map_entry",
    "install_exception_vectors",
    "tlb_refill_handler",
    "general_exception_handler",
    "vm_page_lru_touch",
    "vm_page_pick_slot",
    "vm_init_paging",
    # only cache maintenance, no effect on memory
    "cache_create_dirty_range",
    # library copy of osInitialize without callers (the game calls its own copy, replaced by the runtime)
    "osInitialize_lib_unused",
]

# entrypoint: drop the TLB setup (cop0 writes) and replace the computed jump to the TLB-mapped alias
# (lui t0,0x4000 / ori t0,0x44C / jr t0 -> entry_kuseg -> boot_main) with a direct jump to boot_main.
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x4000040C   # mtc0 t0, Wired
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x40000410   # mtc0 zero, Context
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x4000041C   # mtc0 zero, Index
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x40000444   # jr t0  ->  j boot_main (0x40036F64)
value = 0x0800DBD9

# vi_scheduler_thread sends the per-VI frame sync to the main thread (queue 0x40058DC0, size 1) with OS_MESG_BLOCK.
# The runtime completes RSP/RDP tasks instantly, so the main thread can enter game_restart/FUN_4000a990 without
# taking the last frame sync; the scheduler then blocks before it issues the next gfx task and both threads wait on
# each other. Sending without blocking only drops a sync the main thread would not have used (one per game frame).
# FUN_400341cc (main thread, called from game_restart) spins until the audio code running on vi_scheduler_thread has
# counted DAT_40065C12 down. On the N64 the VI interrupt preempts the spin; here only one game thread runs at a time,
# so the loop head waits for the next external event and lets the higher-priority threads run.
[[patches.hook]]
func = "FUN_400341cc"
before_vram = 0x400341E8   # lhu v0, 0x5C12(a1): head of the spin loop
text = "{ extern void yield_self(uint8_t* rdram); yield_self(rdram); }"

# FUN_41009a00 (task 3, end of the intro logos) polls FUN_4002fd2c until the audio voices have stopped, which only
# happens on the audio code driven by VI events. Same fix: wait for the next external event before each poll.
[[patches.hook]]
func = "FUN_4002fd2c"
before_vram = 0x4002FD2C
text = "{ extern void yield_self(uint8_t* rdram); yield_self(rdram); }"

# Thread 16 (priority 3, FUN_4101dd98: background streaming/cache loop) calls FUN_4101887c and FUN_41018714 for long
# stretches without any OS call. On the N64 the VI/AI interrupts preempt it; here the higher-priority threads (audio
# on vi_scheduler_thread) waited, the audio microcode fell behind and old buffers were played again (stutter).
# preempt_point delivers pending external messages and switches to a woken higher-priority thread.
# FUN_40033e28 (audio frame) only issues the dialogue-stream DMA list when a buffer was refilled; the next frame drops
# the list and reports the loads as done anyway. indy64_audio_dma_fix (main.cpp) issues a list that was left behind.
[[patches.hook]]
func = "FUN_40033e28"
before_vram = 0x4003410C   # jal FUN_40034c9c: both paths of the frame meet here
text = "{ extern void indy64_audio_dma_fix(uint8_t* rdram, recomp_context* ctx); indy64_audio_dma_fix(rdram, ctx); }"

[[patches.hook]]
func = "FUN_41018714"
before_vram = 0x41018714
text = "{ extern void preempt_point(uint8_t* rdram); preempt_point(rdram); }"

[[patches.hook]]
func = "FUN_4101887c"
before_vram = 0x4101887C
text = "{ extern void preempt_point(uint8_t* rdram); preempt_point(rdram); }"

[[patches.hook]]
func = "FUN_41018178"
before_vram = 0x41018178
text = "{ extern void preempt_point(uint8_t* rdram); preempt_point(rdram); }"

# Every pass of FUN_4101dd98's outer loop runs through 0x4101E080 (no branch targets it).
[[patches.hook]]
func = "FUN_4101dd98"
before_vram = 0x4101E080
text = "{ extern void preempt_point(uint8_t* rdram); preempt_point(rdram); }"

# Diagnostics for the speech loader thread (FUN_410098a8: loads sound/s_NNN on request and registers it with MusyX).
[[patches.hook]]
func = "FUN_410098a8"
before_vram = 0x4100993C   # s0 = requested speech number
text = "{ extern void indy64_voice_log(uint8_t* rdram, recomp_context* ctx, int stage); indy64_voice_log(rdram, ctx, 0); }"

[[patches.hook]]
func = "FUN_410098a8"
before_vram = 0x41009978   # v0 = file loaded by FUN_410006c0
text = "{ extern void indy64_voice_log(uint8_t* rdram, recomp_context* ctx, int stage); indy64_voice_log(rdram, ctx, 1); }"

[[patches.hook]]
func = "FUN_410098a8"
before_vram = 0x410099EC   # v0 = MusyX handle from FUN_40028f24
text = "{ extern void indy64_voice_log(uint8_t* rdram, recomp_context* ctx, int stage); indy64_voice_log(rdram, ctx, 2); }"

# FUN_40021a84 (float matrix -> fixed point) converts rows 1-3 by calling FUN_40021ad4 and then falls through into
# FUN_40021ad4 for row 4. The recompiled function ended there, so the 4th row (translation) was never written and
# kept whatever was in the matrix pool before (found by comparing with Project64).
[[patches.hook]]
func = "FUN_40021a84"
before_vram = 0x40021AD0   # lui t6, 0xC00, last instruction before the fall-through
text = "{ ctx->r14 = S32(0xC00 << 16); FUN_40021ad4(rdram, ctx); return; }"

[[patches.instruction]]
func = "vi_scheduler_thread"
vram = 0x40021054   # addiu a2, zero, 1 (OS_MESG_BLOCK)  ->  addiu a2, zero, 0 (OS_MESG_NOBLOCK)
value = 0x24060000

